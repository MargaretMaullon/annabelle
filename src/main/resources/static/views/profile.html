<!-- PAGE 4: PROFILE (every role) -->
<section class="view-screen dsh" id="view-profile">
  <div class="dsh-container narrow">
    <header class="dsh-header">
      <div>
        <p class="dsh-eyebrow">Account</p>
        <h1 class="dsh-title">My profile</h1>
        <p class="dsh-subtitle">Keep your contact details up to date so TalkCare can reach you.</p>
      </div>
      <div class="dsh-header-actions">
        <button type="button" class="dsh-btn secondary" data-action="navigate" data-arg="home">Back to dashboard</button>
      </div>
    </header>

    <div class="profile-layout">
      <section class="dsh-card profile-summary">
        <img src="assets/individual.svg" alt="Profile photo" class="profile-photo" id="profile-display-img">
        <button type="button" class="dsh-btn secondary small" data-action="pick-profile-photo">Change photo</button>
        <h2 class="profile-name" id="profile-summary-name">—</h2>
        <p class="profile-handle" id="profile-summary-username"></p>
        <div class="profile-chips">
          <span class="role-tag" id="profile-summary-role">Client</span>
          <span class="user-status" id="profile-summary-status">Active</span>
        </div>
        <dl class="profile-facts">
          <div><dt>Email</dt><dd id="profile-summary-email">—</dd></div>
          <div><dt>ID on file</dt><dd id="profile-summary-id">Not submitted</dd></div>
        </dl>
        <button type="button" class="dsh-btn primary small" id="profile-verify-btn" data-action="navigate" data-arg="id-verify" hidden>Verify my identity</button>
      </section>

      <section class="dsh-card">
        <form class="tc-form" data-submit="save-profile">
          <h2 class="dsh-card-title wide">Personal details</h2>
          <label class="auth-field wide">
            <span>Full name</span>
            <input type="text" name="fullName" class="auth-input" autocomplete="name" maxlength="150" required>
          </label>
          <label class="auth-field">
            <span>Username</span>
            <input type="text" name="username" class="auth-input" autocomplete="username" maxlength="100" required>
          </label>
          <label class="auth-field">
            <span>Email</span>
            <input type="email" name="email" class="auth-input" autocomplete="email" maxlength="150" required>
          </label>
          <label class="auth-field">
            <span>Mobile number</span>
            <input type="tel" name="contactNo" class="auth-input" autocomplete="tel" maxlength="50">
          </label>
          <label class="auth-field">
            <span>Address</span>
            <input type="text" name="address" class="auth-input" autocomplete="street-address" maxlength="500">
          </label>

          <h2 class="dsh-card-title wide form-section">Change password</h2>
          <p class="dsh-card-sub wide">Leave both fields empty to keep your current password.</p>
          <label class="auth-field">
            <span>New password</span>
            <span class="pw-field"><input type="password" name="password" class="auth-input" autocomplete="new-password" placeholder="At least 8 characters"><button type="button" class="pw-toggle" data-action="toggle-password" aria-label="Show password" title="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="pw-slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></span>
          </label>
          <label class="auth-field">
            <span>Confirm new password</span>
            <span class="pw-field"><input type="password" name="confirmPassword" class="auth-input" autocomplete="new-password"><button type="button" class="pw-toggle" data-action="toggle-password" aria-label="Show password" title="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="pw-slash" x1="3" y1="3" x2="21" y2="21"/></svg></button></span>
          </label>

          <p class="tc-form-status wide" role="status" aria-live="polite"></p>
          <div class="tc-actions wide">
            <button type="submit" class="dsh-btn primary">Save changes</button>
          </div>
        </form>
      </section>
    </div>
  </div>
</section>
