<!-- TOP NAVIGATION BAR -->
<header class="navbar">
  <div class="nav-brand" data-action="navigate" data-arg="welcome">
    <img src="assets/talkcare-logo.png" alt="TalkCare Logo" class="brand-logo-img">
    <span class="brand-name">Talkcare</span>
  </div>

  <!-- Public / Guest Nav links -->
  <ul class="nav-links" id="guest-nav">
    <li><a data-action="navigate" data-arg="welcome">Home</a></li>
    <li><a data-action="navigate" data-arg="about">About</a></li>
    <li><a data-action="navigate" data-arg="faq">FAQ</a></li>
    <li><a data-action="navigate" data-arg="contact">Contact</a></li>
  </ul>

  <!-- Authenticated Nav links -->
  <ul class="nav-links" id="auth-nav" style="display: none;">
    <li><a data-action="navigate" data-arg="welcome" id="nav-item-welcome">Home</a></li>
    <li><a data-action="navigate" data-arg="dashboard" id="nav-item-dashboard">Dashboard</a></li>
    <li><a data-action="navigate" data-arg="services" id="nav-item-services">Services</a></li>
    <li><a data-action="navigate" data-arg="about" id="nav-item-about">About</a></li>
    <li><a data-action="navigate" data-arg="faq" id="nav-item-faq">FAQ</a></li>
  </ul>

  <div class="nav-actions">
    <!-- Database Connection Status Badge -->
    <div class="db-status-badge" data-action="open-db-modal" title="Click to view the TalkCare server connection">
      <span class="db-dot" id="db-status-dot"></span>
      <span id="db-status-text">Server</span>
    </div>

    <!-- Guest Login / Get Started buttons -->
    <div id="guest-buttons" style="display: flex; gap: 12px; align-items: center;">
      <button class="btn-nav-login" data-action="navigate" data-arg="login">Log in</button>
      <button class="btn-nav-getstarted" data-action="navigate" data-arg="register">Get started</button>
    </div>

    <!-- Logged-in User Profile Pill -->
    <div id="auth-user-bar" style="display: none; align-items: center; gap: 14px;">
      <button class="nav-bell" id="nav-bell" title="Notifications" data-action="toggle-notifications">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span class="nav-bell-badge" id="notif-badge" hidden>0</span>
      </button>
      <div class="nav-divider"></div>
      <div class="nav-user-pill" data-action="toggle-user-dropdown">
        <img src="assets/individual.svg" alt="Avatar" class="nav-user-avatar" id="nav-avatar-img">
        <span class="nav-user-name" id="nav-user-name">Max Smith</span>
      </div>
    </div>
  </div>
</header>

<!-- NOTIFICATIONS PANEL -->
<div class="notif-panel" id="notif-panel">
  <div class="notif-head">
    <strong>Notifications</strong>
    <button type="button" class="auth-link" data-action="mark-notifications-read">Mark all as read</button>
  </div>
  <div class="notif-list" id="notif-list"></div>
</div>

<!-- USER PROFILE DROPDOWN MENU (Matching Page 2 & Page 5) -->
<div class="user-dropdown-menu" id="user-dropdown-menu">
  <div class="dropdown-header">
    <img src="assets/individual.svg" alt="Avatar" class="dropdown-avatar" id="dropdown-avatar-img">
    <div>
      <div class="dropdown-user-title" id="dropdown-user-name">Max Smith</div>
      <div class="dropdown-user-role" id="dropdown-user-role">CLIENT</div>
    </div>
  </div>
  
  <div class="dropdown-section">
    <div class="dropdown-section-title">Profile</div>
    <div class="dropdown-item" data-action="navigate" data-arg="profile">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      My Profile
    </div>
    <div class="dropdown-item" id="dropdown-item-contact" data-action="navigate" data-arg="contact">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
      Contacts
    </div>
    <div class="dropdown-item" id="dropdown-item-messages" data-action="navigate" data-arg="services">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
      Messages
    </div>
    <div class="dropdown-item" id="dropdown-item-dashboard" data-action="navigate" data-arg="home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
      My dashboard
    </div>
  </div>

  <div class="dropdown-section">
    <div class="dropdown-section-title">About</div>
    <div class="dropdown-item" data-action="navigate" data-arg="about-thomatt">About Thomatt</div>
    <div class="dropdown-item" data-action="navigate" data-arg="about-justicecare">About Justicecare</div>
    <div class="dropdown-item logout" data-action="logout">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
      Log out
    </div>
  </div>
</div>
